<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Field Diary</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Diary">
<style>
:root {
--bg: #f4f6f8;
--card-bg: #ffffff;
--text: #222222;
--primary: #2563eb;
--accent: #16a34a;
--danger: #dc2626;
--border: #e2e8f0;
--subtext: #64748b;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background: var(--bg);
color: var(--text);
max-width: 680px;
margin: 0 auto;
padding: 16px;
}

h1 {
font-size: 1.5rem;
margin-bottom: 4px;
}

.status-bar {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.8rem;
color: var(--subtext);
margin-bottom: 12px;
}

.status-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background: var(--danger);
}

.status-dot.online { background: var(--accent); }

#installBtn {
display: none;
margin-bottom: 12px;
width: 100%;
background: #475569;
}

.controls {
background: var(--card-bg);
padding: 16px;
border-radius: 8px;
border: 1px solid var(--border);
margin-bottom: 16px;
display: flex;
flex-direction: column;
gap: 8px;
}

.textarea-wrapper {
position: relative;
}

textarea {
width: 100%;
height: 80px;
padding: 8px;
border: 1px solid var(--border);
border-radius: 4px;
box-sizing: border-box;
resize: vertical;
font-family: inherit;
}

.char-count {
font-size: 0.75rem;
color: var(--subtext);
text-align: right;
margin-top: 2px;
}

.media-inputs {
display: flex;
gap: 8px;
flex-wrap: wrap;
}

button, label.file-btn {
background: var(--primary);
color: white;
border: none;
padding: 8px 14px;
border-radius: 4px;
cursor: pointer;
font-weight: 500;
font-size: 0.9rem;
display: inline-flex;
align-items: center;
justify-content: center;
}

button:disabled {
opacity: 0.6;
cursor: not-allowed;
}

label.file-btn {
background: #475569;
}

input[type="file"] {
display: none;
}

.export-btn {
background: var(--accent);
margin-left: auto;
}

.search-box {
width: 100%;
padding: 8px 12px;
border: 1px solid var(--border);
border-radius: 6px;
margin-bottom: 20px;
box-sizing: border-box;
}

.date-group-title {
font-size: 1rem;
font-weight: bold;
color: var(--subtext);
margin: 20px 0 10px 0;
border-bottom: 2px solid var(--border);
padding-bottom: 4px;
}

.timeline-entry {
background: var(--card-bg);
padding: 12px 16px;
border-radius: 6px;
border-left: 4px solid var(--primary);
margin-bottom: 12px;
}

.entry-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 6px;
}

.timestamp {
font-size: 0.8rem;
font-weight: bold;
color: var(--subtext);
}

.delete-btn {
background: transparent;
color: var(--danger);
padding: 2px 6px;
font-size: 0.8rem;
}

.entry-content img {
max-width: 100%;
border-radius: 6px;
margin-top: 8px;
}

.entry-content audio {
width: 100%;
margin-top: 8px;
}

hr.separator {
border: 0;
height: 1px;
background: var(--border);
margin: 16px 0;
}

@media (max-width: 480px) {
.media-inputs {
flex-direction: column;
}
.export-btn {
margin-left: 0;
}
}

.reset-zone {
background: var(--card-bg);
border: 1px dashed var(--danger);
border-radius: 8px;
padding: 14px 16px;
margin: 24px 0;
}

.reset-zone .export-status {
font-size: 0.8rem;
color: var(--subtext);
margin-bottom: 10px;
}

.clear-all-btn {
background: transparent;
color: var(--danger);
border: 1px solid var(--danger);
width: 100%;
}

.reset-confirm {
display: none;
margin-top: 10px;
gap: 8px;
flex-direction: column;
}

.reset-confirm input {
width: 100%;
padding: 8px;
border: 1px solid var(--border);
border-radius: 4px;
box-sizing: border-box;
}

.reset-confirm-actions {
display: flex;
gap: 8px;
}

.reset-confirm-actions button {
flex: 1;
}

.confirm-clear-btn {
background: var(--danger);
}

.cancel-clear-btn {
background: #475569;
}
</style>
</head>
<body>

<h1>Offline Field Diary</h1>
<div class="status-bar">
<span class="status-dot" id="statusDot"></span>
<span id="statusText">Checking connection…</span>
</div>

<button id="installBtn">⬇️ Install app to home screen</button>

<div class="controls">
<div class="textarea-wrapper">
<textarea id="noteInput" placeholder="Write a note... (Ctrl+Enter to submit)"></textarea>
<div id="charCount" class="char-count">0 chars</div>
</div>

<div class="media-inputs">
<button id="addTextBtn">Add Text</button>

<label class="file-btn">
📷 Photo
<input type="file" id="imageInput" accept="image/*" capture="environment">
</label>

<button id="recordBtn">🎙️ Record Audio</button>
<button id="exportBtn" class="export-btn">📄 Export Diary</button>
</div>
</div>

<input type="text" id="searchInput" class="search-box" placeholder="🔍 Search text notes...">

<div class="reset-zone">
<div class="export-status" id="exportStatus">Not exported yet</div>
<button id="clearAllBtn" class="clear-all-btn">🗑️ Clear All &amp; Start Fresh</button>
<div class="reset-confirm" id="resetConfirm">
<span style="font-size:0.8rem;color:var(--subtext);">Make sure today's entries are exported and safely shared first. Type <strong>CLEAR</strong> below to permanently delete all entries.</span>
<input type="text" id="clearConfirmInput" placeholder="Type CLEAR to confirm" autocomplete="off">
<div class="reset-confirm-actions">
<button id="confirmClearBtn" class="confirm-clear-btn" disabled>Delete Everything</button>
<button id="cancelClearBtn" class="cancel-clear-btn">Cancel</button>
</div>
</div>
</div>

<div id="diaryContainer"></div>

<script>
let entries = [];
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let deferredInstallPrompt = null;

const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB limit

function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, function(m) {
    switch (m) {
      case '&': return '&amp;';
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '"': return '&quot;';
      case "'": return '&#39;';
      default: return m;
    }
  });
}

function getTimestamp() {
  const now = new Date();
  return now.toLocaleDateString() + ' | ' + now.toLocaleTimeString();
}

function saveToStorage() {
  try {
    localStorage.setItem('fieldDiaryEntries', JSON.stringify(entries));
  } catch (e) {
    alert("Warning: Local storage full. Entry added, but won't persist across refresh.");
  }
}

function loadFromStorage() {
  const saved = localStorage.getItem('fieldDiaryEntries');
  if (saved) {
    try {
      entries = JSON.parse(saved);
    } catch (e) {
      console.error("Error loading saved diary entries", e);
    }
  }
}

function saveEntry(type, data) {
  const entry = {
    id: Date.now(),
    timestamp: getTimestamp(),
    type: type,
    data: data
  };
  entries.push(entry);
  saveToStorage();
  renderDiary();
}

function deleteEntry(id) {
  if (confirm("Delete this entry?")) {
    entries = entries.filter(e => e.id !== id);
    saveToStorage();
    renderDiary();
  }
}

function addTextNote() {
  const input = document.getElementById('noteInput');
  if (input.value.trim() !== '') {
    saveEntry('text', input.value.trim());
    input.value = '';
    updateCharCount();
  }
}

function updateCharCount() {
  const input = document.getElementById('noteInput');
  document.getElementById('charCount').innerText = `${input.value.length} chars`;
}

const PHOTO_MAX_DIMENSION = 1280; // longest edge, px
const PHOTO_QUALITY = 0.7; // JPEG quality 0-1

// Resizes/re-compresses a captured photo through a canvas before it's
// stored, so entries and exports stay small enough to actually share
// over a slow reconnection later. Raw phone-camera shots (2-5MB+) come
// out at roughly 150-400KB after this.
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > PHOTO_MAX_DIMENSION) {
        height = Math.round(height * (PHOTO_MAX_DIMENSION / width));
        width = PHOTO_MAX_DIMENSION;
      } else if (height > PHOTO_MAX_DIMENSION) {
        width = Math.round(width * (PHOTO_MAX_DIMENSION / height));
        height = PHOTO_MAX_DIMENSION;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function addPhoto(event) {
  const file = event.target.files[0];
  if (file) {
    if (file.size > MAX_FILE_SIZE) {
      alert('Photo is too large! Maximum size is 5MB.');
      event.target.value = '';
      return;
    }
    compressImage(file)
      .then((dataUrl) => {
        saveEntry('image', dataUrl);
        event.target.value = '';
      })
      .catch(() => {
        alert('Could not process that photo.');
        event.target.value = '';
      });
  }
}

async function toggleAudioRecording() {
  const recordBtn = document.getElementById('recordBtn');
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(track => track.stop());
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        audioChunks = [];

        const reader = new FileReader();
        reader.onload = function(e) {
          saveEntry('audio', e.target.result);
        };
        reader.readAsDataURL(audioBlob);
      };

      mediaRecorder.start();
      isRecording = true;
      recordBtn.innerText = "🛑 Stop Recording";
      recordBtn.style.background = "var(--danger)";
    } catch (err) {
      alert("Microphone access denied or not supported.");
    }
  } else {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    isRecording = false;
    recordBtn.innerText = "🎙️ Record Audio";
    recordBtn.style.background = "var(--primary)";
  }
}

function groupByDate(entriesList) {
  const groups = {};
  entriesList.forEach(e => {
    const date = e.timestamp.split('|')[0].trim();
    if (!groups[date]) groups[date] = [];
    groups[date].push(e);
  });
  return groups;
}

function renderDiary() {
  try {
    const container = document.getElementById('diaryContainer');
    const query = document.getElementById('searchInput').value.toLowerCase();
    container.innerHTML = '';

    const filteredEntries = entries.filter(e => {
      if (!query) return true;
      if (e.type === 'text') return e.data.toLowerCase().includes(query);
      return false;
    });

    if (filteredEntries.length === 0) {
      container.innerHTML = '<p style="color: var(--subtext); text-align: center;">No entries found.</p>';
      return;
    }

    const grouped = groupByDate(filteredEntries);

    for (const [date, dateEntries] of Object.entries(grouped)) {
      const groupHeader = document.createElement('div');
      groupHeader.className = 'date-group-title';
      groupHeader.innerText = date;
      container.appendChild(groupHeader);

      dateEntries.forEach((entry) => {
        const item = document.createElement('div');
        item.className = 'timeline-entry';

        let contentHTML = '';
        if (entry.type === 'text') {
          contentHTML = `<p style="margin:0;">${escapeHTML(entry.data)}</p>`;
        } else if (entry.type === 'image') {
          contentHTML = `<img src="${entry.data}" alt="Diary photo">`;
        } else if (entry.type === 'audio') {
          contentHTML = `<audio controls src="${entry.data}"></audio>`;
        }

        const timeOnly = entry.timestamp.split('|')[1] ? entry.timestamp.split('|')[1].trim() : entry.timestamp;

        item.innerHTML = `
          <div class="entry-header">
            <span class="timestamp">${escapeHTML(timeOnly)}</span>
            <button class="delete-btn" data-id="${entry.id}">✕ Delete</button>
          </div>
          <div class="entry-content">${contentHTML}</div>
        `;

        item.querySelector('.delete-btn').addEventListener('click', () => deleteEntry(entry.id));

        container.appendChild(item);

        const hr = document.createElement('hr');
        hr.className = 'separator';
        container.appendChild(hr);
      });
    }
  } catch (e) {
    console.error('Render error:', e);
    document.getElementById('diaryContainer').innerHTML =
      '<p style="color: var(--danger); text-align: center;">Error loading diary entries.</p>';
  }
}

// Builds ONE self-contained HTML file — photos and audio stay embedded as
// base64 data URLs (same as they're stored in the app), and the layout
// reuses the app's own timeline styling, so opening the export looks and
// feels like the app itself rather than a stripped-down log. Nothing to
// keep track of separately, nothing that breaks if a media folder gets
// left behind when the file is shared.
function buildStandaloneHTML() {
  const exportDate = getTimestamp();
  const grouped = groupByDate(entries);

  let bodyHTML = '';
  for (const [date, dateEntries] of Object.entries(grouped)) {
    bodyHTML += `<div class="date-group-title">${escapeHTML(date)}</div>\n`;
    dateEntries.forEach((entry) => {
      let contentHTML = '';
      if (entry.type === 'text') {
        contentHTML = `<p style="margin:0;">${escapeHTML(entry.data)}</p>`;
      } else if (entry.type === 'image') {
        contentHTML = `<img src="${entry.data}" alt="Diary photo">`;
      } else if (entry.type === 'audio') {
        contentHTML = `<audio controls src="${entry.data}"></audio>`;
      }
      const timeOnly = entry.timestamp.split('|')[1] ? entry.timestamp.split('|')[1].trim() : entry.timestamp;
      bodyHTML += `
        <div class="timeline-entry">
          <div class="entry-header">
            <span class="timestamp">${escapeHTML(timeOnly)}</span>
          </div>
          <div class="entry-content">${contentHTML}</div>
        </div>
        <hr class="separator">
      `;
    });
  }

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Diary — Exported ${escapeHTML(exportDate)}</title>
<style>
:root {
  --bg: #f4f6f8; --card-bg: #ffffff; --text: #222222;
  --primary: #2563eb; --border: #e2e8f0; --subtext: #64748b;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  max-width: 680px; margin: 0 auto; padding: 16px;
}
h1 { font-size: 1.5rem; margin-bottom: 4px; }
.meta { font-size: 0.85rem; color: var(--subtext); margin-bottom: 20px; }
.date-group-title {
  font-size: 1rem; font-weight: bold; color: var(--subtext);
  margin: 20px 0 10px 0; border-bottom: 2px solid var(--border); padding-bottom: 4px;
}
.timeline-entry {
  background: var(--card-bg); padding: 12px 16px; border-radius: 6px;
  border-left: 4px solid var(--primary); margin-bottom: 12px;
}
.entry-header { margin-bottom: 6px; }
.timestamp { font-size: 0.8rem; font-weight: bold; color: var(--subtext); }
.entry-content img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
.entry-content audio { width: 100%; margin-top: 8px; }
hr.separator { border: 0; height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>
<h1>Field Diary</h1>
<div class="meta">Exported ${escapeHTML(exportDate)} · ${entries.length} entries</div>
${bodyHTML}
</body>
</html>`;
}

async function exportZip() {
  if (entries.length === 0) {
    alert("Diary is empty!");
    return;
  }

  const btn = document.getElementById('exportBtn');
  const originalText = btn.innerText;
  btn.innerText = '⏳ Exporting...';
  btn.disabled = true;

  try {
    const html = buildStandaloneHTML();
    const content = new Blob([html], { type: 'text/html' });
    const fileName = `Diary_Export_${Date.now()}.html`;
    const file = new File([content], fileName, { type: 'text/html' });

    // If the device supports sharing files directly (typical once back
    // online / near other people), offer the native share sheet so it can
    // go straight to WhatsApp, Drive, email etc. Otherwise fall back to
    // a plain download the user can move manually.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'Field Diary Export',
          text: 'Field diary export'
        });
        recordExport();
        btn.innerText = originalText;
        btn.disabled = false;
        return;
      } catch (shareErr) {
        // User cancelled the share sheet, or it failed — fall through to download.
      }
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = fileName;
    a.click();
    recordExport();
  } catch (err) {
    alert("Failed to export ZIP file.");
    console.error(err);
  } finally {
    btn.innerText = originalText;
    btn.disabled = false;
  }
}

// Records that an export happened, so the Clear All confirmation can show
// whoever's about to wipe entries when they last actually exported. This
// can't guarantee the file was successfully shared/saved elsewhere (a
// download can still fail silently after the browser hands it off), only
// that the app produced and offered one — treat it as a helpful reminder,
// not a guarantee.
function recordExport() {
  localStorage.setItem('fieldDiaryLastExport', new Date().toISOString());
  updateExportStatus();
}

function updateExportStatus() {
  const el = document.getElementById('exportStatus');
  if (!el) return;
  const last = localStorage.getItem('fieldDiaryLastExport');
  if (!last) {
    el.innerText = 'Not exported yet';
    return;
  }
  const d = new Date(last);
  el.innerText = `Last exported: ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;
}

function updateConnectionStatus() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if (navigator.onLine) {
    dot.classList.add('online');
    text.innerText = 'Online';
  } else {
    dot.classList.remove('online');
    text.innerText = 'Offline — entries save locally, export/share once you have signal';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadFromStorage();
  renderDiary();
  updateConnectionStatus();
  updateExportStatus();

  document.getElementById('addTextBtn').addEventListener('click', addTextNote);
  document.getElementById('imageInput').addEventListener('change', addPhoto);
  document.getElementById('recordBtn').addEventListener('click', toggleAudioRecording);
  document.getElementById('exportBtn').addEventListener('click', exportZip);

  // Clear All / Start Fresh — deliberately harder to trigger than a normal
  // button. Reveals a typed-confirmation panel rather than acting on the
  // first tap, since this wipes every entry and can't be undone.
  const clearAllBtn = document.getElementById('clearAllBtn');
  const resetConfirm = document.getElementById('resetConfirm');
  const clearConfirmInput = document.getElementById('clearConfirmInput');
  const confirmClearBtn = document.getElementById('confirmClearBtn');
  const cancelClearBtn = document.getElementById('cancelClearBtn');

  clearAllBtn.addEventListener('click', () => {
    resetConfirm.style.display = 'flex';
    clearAllBtn.style.display = 'none';
    clearConfirmInput.value = '';
    confirmClearBtn.disabled = true;
    clearConfirmInput.focus();
  });

  clearConfirmInput.addEventListener('input', () => {
    confirmClearBtn.disabled = clearConfirmInput.value.trim() !== 'CLEAR';
  });

  cancelClearBtn.addEventListener('click', () => {
    resetConfirm.style.display = 'none';
    clearAllBtn.style.display = 'inline-flex';
    clearConfirmInput.value = '';
  });

  confirmClearBtn.addEventListener('click', () => {
    if (clearConfirmInput.value.trim() !== 'CLEAR') return;
    entries = [];
    saveToStorage();
    renderDiary();
    resetConfirm.style.display = 'none';
    clearAllBtn.style.display = 'inline-flex';
    clearConfirmInput.value = '';
  });

  document.getElementById('noteInput').addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
      addTextNote();
    }
  });

  document.getElementById('noteInput').addEventListener('input', updateCharCount);
  document.getElementById('searchInput').addEventListener('input', renderDiary);

  window.addEventListener('online', updateConnectionStatus);
  window.addEventListener('offline', updateConnectionStatus);

  // Install-to-homescreen prompt (Android/Chrome). iOS has no programmatic
  // prompt; users add via Share > Add to Home Screen instead.
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById('installBtn').style.display = 'inline-flex';
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    document.getElementById('installBtn').style.display = 'none';
  });

  // Register the service worker so the app shell is cached for full
  // offline use after the first successful load.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.error('Service worker registration failed:', err);
    });
  }
});
</script>
</body>
</html>
